<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 64" width="430" height="64" role="img" aria-label="Rental Confirmation">
  <defs>
    <linearGradient id="rc-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21404c" />
      <stop offset="1" stop-color="#0c1c24" />
    </linearGradient>
    <linearGradient id="rc-check" x1="18" y1="10" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa084" />
      <stop offset="1" stop-color="#d2401f" />
    </linearGradient>
  </defs>
  <!-- Mark. Same tile, radius, gradient and gold ring as the reference lockup;
       the glyph is a confirmation check rather than a compass star, because the
       brand is a rental confirmation rather than a travel wayfinder. -->
  <rect width="64" height="64" rx="16" fill="url(#rc-tile)" />
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#d0a955" stroke-opacity="0.45" stroke-width="1.2" />
  <path fill="none" stroke="url(#rc-check)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"
        d="M21 32.6 28.6 40.2 43.4 25.4" />
  <circle cx="32" cy="32" r="2.6" fill="#0c1c24" fill-opacity="0" />
  <!-- Wordmark -->
  <text x="84" y="36" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="-0.7">
    <tspan fill="#0c1c24">Rental</tspan><tspan fill="#d2401f" dx="8">Confirmation</tspan>
  </text>
  <text x="84" y="52" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="2.4" fill="#5b7a86">
    CAR RENTAL, CONFIRMED
  </text>
</svg>
